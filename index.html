<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Bloxd Downloads</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  /* Optional: put your own background at assets/images/background.png */
  :root {
    --bg-image: url("assets/images/background.png");
    --sky-top: #5fb4f0; --sky-bottom: #bfe6ff;
    --cloud: #ffffff; --stars: 0;
    --grass: #5aa832; --grass-dark: #478a26; --dirt: #8a5a35;
    --card: #ffffff; --line: #1d2b3a; --text: #1d2b3a; --muted: #5d7186;
    --head-text: #0e1a27; --head-shadow: 0 2px 0 rgba(255,255,255,.55);
    --iconbg: #eaf4fb; --field: #f5fafd; --bar: #fff7cc;
    --shade: rgba(255,255,255,.18);
    --accent: #3fae3a; --accent-dark: #2d8a2a;
    --danger: #d9473b; --danger-dark: #a8322a;
    --blue: #3b82d9; --blue-dark: #2a62a8;
  }
  :root[data-theme="dark"] {
    --sky-top: #070d22; --sky-bottom: #1d2f5c;
    --cloud: #8da2d6; --stars: 1;
    --grass: #2f6b22; --grass-dark: #255a1b; --dirt: #4d3220;
    --card: #1a2436; --line: #05080f; --text: #e8eef7; --muted: #95a6bb;
    --head-text: #ffffff; --head-shadow: 0 3px 0 rgba(0,0,0,.6);
    --iconbg: #243249; --field: #121b2b; --bar: #3a3510;
    --shade: rgba(0,5,20,.55);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: "Pixelify Sans", "Trebuchet MS", system-ui, sans-serif;
    color: var(--text);
    background:
      var(--bg-image) center / cover no-repeat fixed,
      linear-gradient(var(--grass) 0 24px, var(--grass-dark) 24px 32px, var(--dirt) 32px) bottom / 100% 160px no-repeat fixed,
      linear-gradient(var(--sky-top), var(--sky-bottom)) fixed;
    min-height: 100vh;
    padding-bottom: 180px;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: .85;
    background:
      linear-gradient(var(--cloud),var(--cloud)) 12% 14% / 160px 28px no-repeat,
      linear-gradient(var(--cloud),var(--cloud)) calc(12% + 28px) calc(14% - 24px) / 100px 24px no-repeat,
      linear-gradient(var(--cloud),var(--cloud)) 68% 26% / 200px 32px no-repeat,
      linear-gradient(var(--cloud),var(--cloud)) calc(68% + 36px) calc(26% - 28px) / 120px 28px no-repeat,
      linear-gradient(var(--cloud),var(--cloud)) 38% 8% / 120px 24px no-repeat;
  }
  .stars {
    position: fixed; inset: 0 0 160px 0; pointer-events: none; z-index: 0;
    opacity: var(--stars);
    background:
      linear-gradient(#fff,#fff) 8% 12% / 4px 4px no-repeat,
      linear-gradient(#fff,#fff) 21% 34% / 4px 4px no-repeat,
      linear-gradient(#fff,#fff) 33% 8% / 6px 6px no-repeat,
      linear-gradient(#fff,#fff) 47% 22% / 4px 4px no-repeat,
      linear-gradient(#fff,#fff) 58% 6% / 4px 4px no-repeat,
      linear-gradient(#fff,#fff) 74% 16% / 6px 6px no-repeat,
      linear-gradient(#fff,#fff) 86% 30% / 4px 4px no-repeat,
      linear-gradient(#fff,#fff) 93% 9% / 4px 4px no-repeat,
      linear-gradient(#fff,#fff) 14% 58% / 4px 4px no-repeat,
      linear-gradient(#fff,#fff) 41% 52% / 4px 4px no-repeat,
      linear-gradient(#fff,#fff) 66% 60% / 4px 4px no-repeat,
      linear-gradient(#fff,#fff) 90% 55% / 6px 6px no-repeat;
  }
  body.has-bg::before, body.has-bg .stars { display: none; }
  body.has-bg::after { content: ""; position: fixed; inset: 0; background: var(--shade); pointer-events: none; z-index: 0; }
  main, header, footer, .adminbar { position: relative; z-index: 1; }

  /* ---------- header ---------- */
  header { text-align: center; padding: 88px 20px 12px; }
  .logo {
    display: block; margin: 0 auto 14px;
    max-width: min(80%, 420px); max-height: 150px; object-fit: contain;
    filter: drop-shadow(0 6px 0 rgba(0,0,0,.25));
    transition: transform .28s cubic-bezier(.34, 1.56, .64, 1), filter .28s;
    cursor: pointer;
  }
  .logo:hover, .logo:focus-visible { transform: scale(1.14) translateY(-6px); filter: drop-shadow(0 12px 0 rgba(0,0,0,.25)); }
  header h1 { margin: 0; font-size: clamp(2.2rem, 6vw, 3.6rem); font-weight: 700; color: var(--head-text); text-shadow: var(--head-shadow); }

  /* ---------- socials ---------- */
  .socials { display: flex; justify-content: center; gap: 14px; margin-top: 22px; flex-wrap: wrap; }
  .socials .hint-empty { color: var(--head-text); font-size: .95rem; text-shadow: var(--head-shadow); }
  .social {
    --brand: #3b82d9;
    width: 52px; height: 52px; display: grid; place-items: center;
    background: var(--brand); color: #fff;
    border: 3px solid var(--line); box-shadow: 0 5px 0 var(--line);
    transition: transform .12s, box-shadow .12s;
  }
  .social svg { width: 28px; height: 28px; }
  .social:hover { transform: translateY(-3px); box-shadow: 0 8px 0 var(--line); }
  .social:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--line); }
  .social:focus-visible { outline: 3px solid #ffd23f; outline-offset: 3px; }
  .social.discord  { --brand: #5865f2; }
  .social.youtube  { --brand: #ff0000; }
  .social.bloxdhub { --brand: #3fae3a; }
  .social.tiktok   { --brand: #161823; }
  .social.instagram{ --brand: #d6249f; }
  .social.x        { --brand: #14171a; }
  .social.twitch   { --brand: #9146ff; }
  .social.website  { --brand: #3b82d9; }
  .social.email    { --brand: #d9822b; }

  /* ---------- top corner buttons ---------- */
  .theme-toggle {
    position: fixed; top: 16px; right: 16px; z-index: 20;
    width: 52px; height: 52px; padding: 0; cursor: pointer;
    background: var(--card); color: var(--text);
    border: 3px solid var(--line); box-shadow: 0 5px 0 var(--line);
    transition: transform .12s, box-shadow .12s, background-color .4s;
  }
  .theme-toggle:hover { transform: translateY(-2px); box-shadow: 0 7px 0 var(--line); }
  .theme-toggle:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--line); }
  .theme-toggle:focus-visible { outline: 3px solid #ffd23f; outline-offset: 3px; }
  .theme-toggle svg {
    position: absolute; inset: 0; margin: auto; width: 28px; height: 28px;
    transition: transform .6s cubic-bezier(.5, 1.6, .4, 1), opacity .35s;
  }
  .theme-toggle .sun { color: #f5a623; }
  .theme-toggle .moon { color: #ffd86b; }
  :root[data-theme="light"] .theme-toggle .moon { transform: rotate(-120deg) scale(0); opacity: 0; }
  :root[data-theme="light"] .theme-toggle .sun  { transform: rotate(0) scale(1); opacity: 1; }
  :root[data-theme="dark"] .theme-toggle .sun  { transform: rotate(120deg) scale(0); opacity: 0; }
  :root[data-theme="dark"] .theme-toggle .moon { transform: rotate(0) scale(1); opacity: 1; }

  .contact-btn {
    position: fixed; top: 16px; left: 16px; z-index: 20;
    height: 52px; max-width: calc(100vw - 100px); padding: 0 16px;
    display: flex; align-items: center; gap: 8px;
    font: inherit; font-weight: 700; font-size: 1rem; color: #fff; text-decoration: none;
    background: var(--accent); border: 3px solid var(--line); box-shadow: 0 5px 0 var(--accent-dark);
    cursor: pointer; transition: transform .12s, box-shadow .12s;
  }
  .contact-btn svg { width: 22px; height: 22px; flex: none; }
  .contact-btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .contact-btn:hover { transform: translateY(-2px); box-shadow: 0 7px 0 var(--accent-dark); filter: brightness(1.08); }
  .contact-btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--accent-dark); }
  .contact-btn:focus-visible { outline: 3px solid #ffd23f; outline-offset: 3px; }

  ::view-transition-old(root), ::view-transition-new(root) { animation: none; mix-blend-mode: normal; }
  ::view-transition-old(root) { z-index: 1; }
  ::view-transition-new(root) { z-index: 2; }

  /* ---------- cards ---------- */
  .grid { max-width: 1040px; margin: 36px auto 0; padding: 0 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; }
  .card { background: var(--card); border: 4px solid var(--line); box-shadow: 0 8px 0 var(--line); padding: 18px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  .meta { width: 100%; display: flex; justify-content: space-between; font-size: .85rem; color: var(--muted); min-height: 1.2em; }
  .icon { width: 112px; height: 112px; margin: 14px 0 10px; display: grid; place-items: center; background: var(--iconbg); border: 3px solid var(--line); }
  .icon img { width: 88px; height: 88px; object-fit: contain; image-rendering: pixelated; }
  .card h2 { margin: 6px 0 2px; font-size: 1.35rem; font-weight: 700; overflow-wrap: anywhere; }
  .card .sub { margin: 0 0 18px; color: var(--muted); font-size: 1rem; }

  .btn { font: inherit; font-weight: 700; font-size: 1.1rem; color: #fff; text-decoration: none; text-align: center; display: block; padding: 12px 16px; background: var(--accent); border: 3px solid var(--line); box-shadow: 0 5px 0 var(--accent-dark); cursor: pointer; }
  .btn:hover { filter: brightness(1.08); }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--accent-dark); }
  .btn:focus-visible { outline: 3px solid #ffd23f; outline-offset: 3px; }
  .card .btn { margin-top: auto; width: 100%; }
  .btn.small { font-size: .95rem; padding: 7px 12px; box-shadow: 0 4px 0 var(--accent-dark); }
  .btn.blue { background: var(--blue); box-shadow: 0 5px 0 var(--blue-dark); }
  .btn.blue.small { box-shadow: 0 4px 0 var(--blue-dark); }
  .btn.red { background: var(--danger); box-shadow: 0 5px 0 var(--danger-dark); }
  .btn.red.small { box-shadow: 0 4px 0 var(--danger-dark); }
  .btn.grey { background: #8a97a5; box-shadow: 0 4px 0 #66727f; }

  footer { text-align: center; margin-top: 48px; color: var(--head-text); font-size: .95rem; text-shadow: var(--head-shadow); }

  /* ---------- editor mode ---------- */
  .adminbar { max-width: 1040px; margin: 20px auto 0; padding: 14px 18px; background: var(--bar); color: var(--text); border: 4px solid var(--line); box-shadow: 0 6px 0 var(--line); display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .adminbar strong { margin-right: auto; }
  .adminbar .btn { display: inline-block; }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; width: 100%; margin-bottom: 12px; }
  .tools .btn { flex: 1; min-width: 70px; }
  .card.add { justify-content: center; min-height: 260px; border-style: dashed; background: var(--card); opacity: .9; cursor: pointer; font-size: 1.3rem; font-weight: 700; }
  .card.add span { font-size: 3rem; line-height: 1; }

  dialog { border: 4px solid var(--line); padding: 0; width: min(500px, 94vw); max-height: 92vh; font-family: inherit; color: var(--text); background: var(--card); box-shadow: 0 8px 0 var(--line); }
  dialog::backdrop { background: rgba(10,25,40,.6); }
  dialog form { padding: 20px; display: grid; gap: 12px; }
  dialog h3 { margin: 0; font-size: 1.5rem; }
  label { display: grid; gap: 4px; font-weight: 600; font-size: .95rem; }
  input[type=text], select { font: inherit; color: var(--text); padding: 9px 10px; border: 3px solid var(--line); background: var(--field); width: 100%; }
  input[type=text]:focus-visible, select:focus-visible { outline: 3px solid #ffd23f; }
  .hint { font-weight: 400; font-size: .8rem; color: var(--muted); }
  .thumbrow { display: flex; gap: 12px; align-items: center; }
  .thumbrow .icon { margin: 0; width: 84px; height: 84px; flex: none; }
  .thumbrow .icon img { width: 64px; height: 64px; }
  .thumbbtns { display: flex; flex-direction: column; gap: 8px; }
  .logoprev { width: 120px; height: 84px; flex: none; display: grid; place-items: center; background: var(--iconbg); border: 3px solid var(--line); overflow: hidden; font-size: .8rem; color: var(--muted); text-align: center; }
  .logoprev img { max-width: 100%; max-height: 100%; object-fit: contain; }
  .row { display: flex; gap: 10px; justify-content: flex-end; margin-top: 4px; }
  .socrows { display: grid; gap: 10px; max-height: 44vh; overflow-y: auto; padding-bottom: 6px; }
  .socrow { display: grid; grid-template-columns: 130px 1fr auto; gap: 8px; align-items: center; }
  .socrow .btn { padding: 7px 10px; }
  @media (max-width: 460px) { .socrow { grid-template-columns: 1fr auto; } .socrow select { grid-column: 1 / -1; } }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #1d2b3a; color: #fff; padding: 12px 18px; z-index: 50; border: 3px solid #fff; }
  [hidden] { display: none !important; }

  @media (prefers-reduced-motion: reduce) {
    .theme-toggle svg, .social, .logo, .contact-btn { transition: none; }
  }
</style>
</head>
<body>

<div class="stars" aria-hidden="true"></div>

<a class="contact-btn" id="contactBtn" tabindex="0" hidden>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/></svg>
  <span id="contactText"></span>
</a>

<button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch between light and dark theme" title="Light / dark">
  <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
    <circle cx="12" cy="12" r="4.5" fill="currentColor"/>
    <path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/>
  </svg>
  <svg class="moon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
  </svg>
</button>

<header>
  <img class="logo" id="siteLogo" alt="" tabindex="0" hidden>
  <h1 id="siteTitle"></h1>
  <div class="socials" id="socials"></div>
</header>

<div class="adminbar" id="adminbar" hidden>
  <strong>Editor mode</strong>
  <button class="btn small blue" id="btnSite">Title &amp; logo</button>
  <button class="btn small blue" id="btnSocials">Socials</button>
  <button class="btn small blue" id="btnContact">Top-left button</button>
  <button class="btn small" id="btnExport">Save downloads.json</button>
  <button class="btn small grey" id="btnImport">Load json</button>
  <button class="btn small red" id="btnReset">Discard changes</button>
  <input type="file" id="importFile" accept=".json,application/json" hidden>
</div>

<main><div class="grid" id="grid"></div></main>
<footer id="footer"></footer>

<!-- download editor -->
<dialog id="itemDialog">
  <form method="dialog" id="itemForm">
    <h3 id="itemDialogTitle">Add download</h3>
    <label>Name
      <input type="text" id="fTitle" required placeholder="My Texture Pack">
    </label>
    <label>Small line under the name
      <input type="text" id="fSub" placeholder="Texture Pack, Asset Pack, by me...">
    </label>
    <label>File path or link
      <input type="text" id="fFile" required placeholder="files/my-pack.zip">
      <span class="hint">Upload the file to your repo's files folder and type files/name.zip, or paste any direct link.</span>
    </label>
    <label>Updated text
      <input type="text" id="fUpdated" placeholder="Nov 22, 2026">
    </label>
    <div>
      <div style="font-weight:600;font-size:.95rem;margin-bottom:6px">Thumbnail</div>
      <div class="thumbrow">
        <div class="icon" id="fPreview"></div>
        <div class="thumbbtns">
          <button type="button" class="btn small blue" id="fPick">Choose image</button>
          <button type="button" class="btn small grey" id="fClear">Remove</button>
        </div>
        <input type="file" id="fImage" accept="image/*" hidden>
      </div>
    </div>
    <div class="row">
      <button type="button" class="btn small grey" id="fCancel">Cancel</button>
      <button type="submit" class="btn small">Save</button>
    </div>
  </form>
</dialog>

<!-- title & logo editor -->
<dialog id="siteDialog">
  <form method="dialog" id="siteForm">
    <h3>Title &amp; logo</h3>
    <label>Page title <input type="text" id="sTitle"></label>
    <label>Footer credit <input type="text" id="sCredit"></label>
    <div>
      <div style="font-weight:600;font-size:.95rem;margin-bottom:6px">Logo (PNG pops up when hovered)</div>
      <div class="thumbrow">
        <div class="logoprev" id="sLogoPreview">No logo</div>
        <div class="thumbbtns">
          <button type="button" class="btn small blue" id="sLogoPick">Choose PNG</button>
          <button type="button" class="btn small grey" id="sLogoClear">Remove</button>
        </div>
        <input type="file" id="sLogoFile" accept="image/png,image/*" hidden>
      </div>
    </div>
    <div class="row">
      <button type="button" class="btn small grey" id="sCancel">Cancel</button>
      <button type="submit" class="btn small">Save</button>
    </div>
  </form>
</dialog>

<!-- socials editor -->
<dialog id="socialDialog">
  <form method="dialog" id="socialForm">
    <h3>Social links</h3>
    <span class="hint">Add as many as you like. Rows with an empty link are ignored. For Email just type your address.</span>
    <div class="socrows" id="socRows"></div>
    <button type="button" class="btn small blue" id="socAdd">+ Add social</button>
    <div class="row">
      <button type="button" class="btn small grey" id="lCancel">Cancel</button>
      <button type="submit" class="btn small">Save</button>
    </div>
  </form>
</dialog>

<!-- top-left button editor -->
<dialog id="contactDialog">
  <form method="dialog" id="contactForm">
    <h3>Top-left button</h3>
    <label>Button text <input type="text" id="cText" placeholder="Build your own website!"></label>
    <label>Where it goes
      <input type="text" id="cLink" placeholder="https://discord.gg/yourinvite or you@email.com">
      <span class="hint">A Discord invite, any link, or an email address. Visitors only see the button once this is filled in.</span>
    </label>
    <div class="row">
      <button type="button" class="btn small grey" id="cCancel">Cancel</button>
      <button type="submit" class="btn small">Save</button>
    </div>
  </form>
</dialog>

<script>
/* =============================================================
   HOW THIS WORKS
   - Visitors see whatever is in downloads.json (in your repo).
   - To edit: open your site with  ?admin  on the end, e.g.
       https://YOUR-USERNAME.github.io/REPO-NAME/?admin
     Change cards, socials, logo and the top-left button, then
     press "Save downloads.json" and upload that file to your
     GitHub repo (replace the old one). Done.
   ============================================================= */

const DEFAULT_DATA = {
  site: {
    title: "My Bloxd Downloads",
    credit: "YourName",
    logo: "",
    contact: { text: "Build your own website!", link: "" },
    socials: []
  },
  items: [
    { title: "Essentials", sub: "Asset Pack", icon: "", file: "files/essentials.zip", updated: "Nov 22, 2026" }
  ]
};

const IS_ADMIN = /[?&#]admin\b/.test(location.search + location.hash);
const DRAFT_KEY = "dl-site-draft";
const THEME_KEY = "dl-site-theme";
let data = null;
let editIndex = -1;
let editIcon = "";
let editLogo = "";
let editSocials = [];

const $ = id => document.getElementById(id);

/* ---------- social icons ---------- */
const SOCIAL_NAMES = {
  discord: "Discord", youtube: "YouTube", bloxdhub: "BloxdHub", tiktok: "TikTok",
  instagram: "Instagram", x: "X (Twitter)", twitch: "Twitch", website: "Website", email: "Email"
};
const svg = inner => '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">' + inner + '</svg>';
const SOCIAL_ICONS = {
  discord: svg('<path d="M19.5 5.5C18.1 4.8 16.6 4.4 15.1 4.1L14.6 5.1A13 13 0 0 0 9.4 5.1L8.9 4.1C7.4 4.4 5.9 4.8 4.5 5.5 2 9.1 1.3 13.1 1.7 17.5 3.4 18.8 5.1 19.5 6.7 20L7.8 18.2C7.2 18 6.6 17.7 6.1 17.3L6.5 17C9.8 18.5 14.2 18.5 17.5 17L17.9 17.3C17.4 17.7 16.8 18 16.2 18.2L17.3 20C18.9 19.5 20.6 18.8 22.3 17.5 22.7 13.1 22 9.1 19.5 5.5Z"/><circle cx="8.8" cy="12.5" r="1.7" fill="var(--brand)"/><circle cx="15.2" cy="12.5" r="1.7" fill="var(--brand)"/>'),
  youtube: svg('<path d="M23 7.2A3 3 0 0 0 20.9 5.1C19 4.6 12 4.6 12 4.6S5 4.6 3.1 5.1A3 3 0 0 0 1 7.2C.5 9.1.5 12 .5 12S.5 14.9 1 16.8A3 3 0 0 0 3.1 18.9C5 19.4 12 19.4 12 19.4S19 19.4 20.9 18.9A3 3 0 0 0 23 16.8C23.5 14.9 23.5 12 23.5 12S23.5 9.1 23 7.2Z"/><path d="M9.8 15.2V8.8L15.5 12Z" fill="var(--brand)"/>'),
  bloxdhub: svg('<path d="M12 2 21 7V17L12 22 3 17V7Z"/><path d="M3 7 12 12 21 7M12 12V22" fill="none" stroke="var(--brand)" stroke-width="1.6" stroke-linejoin="round"/>'),
  tiktok: svg('<path d="M16.5 3c.3 2.3 1.7 3.9 4 4.1v3.1a7.2 7.2 0 0 1-4-1.3v6.1a6 6 0 1 1-6-6c.3 0 .6 0 .9.1v3.2a2.9 2.9 0 1 0 2 2.8V3z"/>'),
  instagram: svg('<rect x="3" y="3" width="18" height="18" rx="5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="17.2" cy="6.8" r="1.2"/>'),
  x: svg('<path d="M4.5 4.5l15 15M19.5 4.5l-15 15" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" fill="none"/>'),
  twitch: svg('<path d="M4 3h17v11l-5 5h-4l-3 3v-3H4z"/><path d="M11 7.5v4.5M16 7.5v4.5" stroke="var(--brand)" stroke-width="1.8" fill="none"/>'),
  website: svg('<circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18" fill="none" stroke="currentColor" stroke-width="1.8"/>'),
  email: svg('<rect x="2.5" y="5" width="19" height="14" rx="2"/><path d="M3 7l9 6 9-6" fill="none" stroke="var(--brand)" stroke-width="1.8" stroke-linejoin="round"/>')
};

/* turn what you typed into a proper link */
function toLink(v) {
  v = (v || "").trim();
  if (!v) return "";
  if (/^(https?:|mailto:)/i.test(v)) return v;
  if (/^[^\s@\/]+@[^\s@\/]+\.[^\s@\/]+$/.test(v)) return "mailto:" + v;
  return "https://" + v;
}

/* ---------- theme ---------- */
function currentTheme() { return document.documentElement.dataset.theme; }

function applyTheme(t) {
  document.documentElement.dataset.theme = t;
  try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
}

function initTheme() {
  let t = null;
  try { t = localStorage.getItem(THEME_KEY); } catch (e) {}
  if (t !== "dark" && t !== "light") {
    t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  document.documentElement.dataset.theme = t;
}

$("themeToggle").onclick = () => {
  const next = currentTheme() === "dark" ? "light" : "dark";
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (!document.startViewTransition || reduce) { applyTheme(next); return; }

  const r = $("themeToggle").getBoundingClientRect();
  const x = r.left + r.width / 2, y = r.top + r.height / 2;
  const radius = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
  const vt = document.startViewTransition(() => applyTheme(next));
  vt.ready.then(() => {
    document.documentElement.animate(
      { clipPath: ["circle(0px at " + x + "px " + y + "px)", "circle(" + radius + "px at " + x + "px " + y + "px)"] },
      { duration: 700, easing: "ease-in-out", pseudoElement: "::view-transition-new(root)" }
    );
  }).catch(() => {});
};

/* ---------- loading ---------- */
function normalize(d) {
  d.site = d.site || {};
  delete d.site.subtitle;                       /* the small text under the title is gone */
  d.site.title = d.site.title || "";
  d.site.credit = d.site.credit || "";
  d.site.logo = d.site.logo || "";
  d.site.contact = Object.assign({ text: "Build your own website!", link: "" }, d.site.contact || {});
  if (!d.site.contact.text) d.site.contact.text = "Build your own website!";

  /* old files stored socials as {discord:"..", youtube:".."}; turn that into a list */
  let s = d.site.socials;
  if (s && !Array.isArray(s)) {
    s = Object.keys(s).filter(k => s[k]).map(k => ({ type: k, url: s[k] }));
  }
  d.site.socials = Array.isArray(s) ? s : [];
  d.items = Array.isArray(d.items) ? d.items : [];
  return d;
}

async function load() {
  if (IS_ADMIN) {
    try {
      const d = localStorage.getItem(DRAFT_KEY);
      if (d) { data = normalize(JSON.parse(d)); return; }
    } catch (e) {}
  }
  try {
    const r = await fetch("downloads.json?v=" + Date.now());
    if (!r.ok) throw new Error("no json");
    data = normalize(await r.json());
  } catch (e) {
    data = normalize(structuredClone(DEFAULT_DATA));
  }
}

function saveDraft() {
  try { localStorage.setItem(DRAFT_KEY, JSON.stringify(data)); } catch (e) {}
}

/* ---------- rendering ---------- */
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

function makeIcon(src, alt) {
  const box = el("div", "icon");
  if (!src) { box.textContent = "\u{1F4E6}"; box.style.fontSize = "52px"; return box; }
  const img = new Image();
  img.src = src; img.alt = alt || "";
  img.onerror = () => { box.textContent = "\u{1F4E6}"; box.style.fontSize = "52px"; };
  box.appendChild(img);
  return box;
}

function renderSocials() {
  const wrap = $("socials");
  wrap.replaceChildren();
  let count = 0;
  data.site.socials.forEach(s => {
    const url = toLink(s.url);
    if (!url) return;
    const type = SOCIAL_ICONS[s.type] ? s.type : "website";
    const a = el("a", "social " + type);
    a.href = url;
    if (!url.startsWith("mailto:")) { a.target = "_blank"; a.rel = "noopener noreferrer"; }
    a.title = SOCIAL_NAMES[type];
    a.setAttribute("aria-label", SOCIAL_NAMES[type]);
    a.innerHTML = SOCIAL_ICONS[type];
    wrap.appendChild(a);
    count++;
  });
  if (!count && IS_ADMIN) wrap.appendChild(el("span", "hint-empty", "No social links yet. Press Socials in the editor bar."));
}

function renderContact() {
  const c = data.site.contact;
  const btn = $("contactBtn");
  const link = toLink(c.link);
  $("contactText").textContent = c.text;
  btn.hidden = !link && !IS_ADMIN;
  if (link) {
    btn.href = link;
    if (link.startsWith("mailto:")) { btn.removeAttribute("target"); btn.removeAttribute("rel"); }
    else { btn.target = "_blank"; btn.rel = "noopener noreferrer"; }
  } else {
    btn.removeAttribute("href");
  }
}

function renderLogo() {
  const img = $("siteLogo");
  if (data.site.logo) { img.src = data.site.logo; img.alt = data.site.title || "Logo"; img.hidden = false; }
  else { img.removeAttribute("src"); img.hidden = true; }
}

function render() {
  document.title = data.site.title || "Downloads";
  $("siteTitle").textContent = data.site.title;
  $("siteTitle").hidden = !data.site.title;
  $("footer").textContent = data.site.credit ? "Website by " + data.site.credit : "";
  renderLogo();
  renderSocials();
  renderContact();

  const grid = $("grid");
  grid.replaceChildren();

  data.items.forEach((item, i) => {
    const card = el("article", "card");

    if (IS_ADMIN) {
      const tools = el("div", "tools");
      tools.append(
        tool("Edit", "blue", () => openItem(i)),
        tool("\u2190", "grey", () => move(i, -1)),
        tool("\u2192", "grey", () => move(i, 1)),
        tool("Delete", "red", () => remove(i))
      );
      card.appendChild(tools);
    }

    const meta = el("div", "meta");
    meta.appendChild(el("span", "", item.updated ? "Updated: " + item.updated : ""));
    card.append(meta, makeIcon(item.icon, item.sub), el("h2", "", item.title), el("p", "sub", item.sub || ""));

    const a = el("a", "btn", "Download");
    a.href = item.file;
    a.setAttribute("download", "");
    card.appendChild(a);
    grid.appendChild(card);
  });

  if (IS_ADMIN) {
    const add = el("article", "card add");
    add.tabIndex = 0;
    add.append(el("span", "", "+"), document.createTextNode("Add download"));
    add.onclick = () => openItem(-1);
    add.onkeydown = e => { if (e.key === "Enter" || e.key === " ") openItem(-1); };
    grid.appendChild(add);
  }
}

function tool(label, kind, fn) {
  const b = el("button", "btn small " + kind, label);
  b.type = "button";
  b.onclick = fn;
  return b;
}

/* ---------- shared helpers ---------- */
function changed() { saveDraft(); render(); }

/* shrink a chosen image and give back a PNG data URL */
function readImage(file, max, done) {
  const reader = new FileReader();
  reader.onload = () => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      done(c.toDataURL("image/png"));
    };
    img.src = reader.result;
  };
  reader.readAsDataURL(file);
}

/* ---------- download editor ---------- */
function move(i, dir) {
  const j = i + dir;
  if (j < 0 || j >= data.items.length) return;
  [data.items[i], data.items[j]] = [data.items[j], data.items[i]];
  changed();
}

function remove(i) {
  if (!confirm('Delete "' + data.items[i].title + '"?')) return;
  data.items.splice(i, 1);
  changed();
}

function todayText() {
  return new Date().toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
}

function setPreview() {
  const p = $("fPreview");
  const box = makeIcon(editIcon, "");
  p.innerHTML = box.innerHTML;
  p.style.fontSize = box.style.fontSize;
}

function openItem(i) {
  editIndex = i;
  const it = i >= 0 ? data.items[i] : { title: "", sub: "", icon: "", file: "files/", updated: todayText() };
  $("itemDialogTitle").textContent = i >= 0 ? "Edit download" : "Add download";
  $("fTitle").value = it.title;
  $("fSub").value = it.sub || "";
  $("fFile").value = it.file;
  $("fUpdated").value = it.updated || "";
  editIcon = it.icon || "";
  setPreview();
  $("itemDialog").showModal();
}

$("fPick").onclick = () => $("fImage").click();
$("fClear").onclick = () => { editIcon = ""; setPreview(); };
$("fCancel").onclick = () => $("itemDialog").close();
$("fImage").onchange = e => {
  const f = e.target.files[0];
  if (f) readImage(f, 256, url => { editIcon = url; setPreview(); });
  e.target.value = "";
};
$("itemForm").onsubmit = () => {
  const item = {
    title: $("fTitle").value.trim(),
    sub: $("fSub").value.trim(),
    icon: editIcon,
    file: $("fFile").value.trim(),
    updated: $("fUpdated").value.trim()
  };
  if (editIndex >= 0) data.items[editIndex] = item; else data.items.push(item);
  changed();
};

/* ---------- title & logo editor ---------- */
function setLogoPreview() {
  const p = $("sLogoPreview");
  p.replaceChildren();
  if (editLogo) { const i = new Image(); i.src = editLogo; p.appendChild(i); }
  else p.textContent = "No logo";
}
$("btnSite").onclick = () => {
  $("sTitle").value = data.site.title;
  $("sCredit").value = data.site.credit;
  editLogo = data.site.logo;
  setLogoPreview();
  $("siteDialog").showModal();
};
$("sLogoPick").onclick = () => $("sLogoFile").click();
$("sLogoClear").onclick = () => { editLogo = ""; setLogoPreview(); };
$("sLogoFile").onchange = e => {
  const f = e.target.files[0];
  if (f) readImage(f, 512, url => { editLogo = url; setLogoPreview(); });
  e.target.value = "";
};
$("sCancel").onclick = () => $("siteDialog").close();
$("siteForm").onsubmit = () => {
  data.site.title = $("sTitle").value.trim();
  data.site.credit = $("sCredit").value.trim();
  data.site.logo = editLogo;
  changed();
};

/* ---------- socials editor (any number of them) ---------- */
function renderSocRows() {
  const box = $("socRows");
  box.replaceChildren();
  editSocials.forEach((s, i) => {
    const row = el("div", "socrow");
    const sel = document.createElement("select");
    sel.setAttribute("aria-label", "Platform");
    Object.keys(SOCIAL_NAMES).forEach(k => {
      const o = el("option", "", SOCIAL_NAMES[k]);
      o.value = k;
      if (k === s.type) o.selected = true;
      sel.appendChild(o);
    });
    sel.onchange = () => { s.type = sel.value; };
    const inp = document.createElement("input");
    inp.type = "text";
    inp.value = s.url;
    inp.placeholder = s.type === "email" ? "you@email.com" : "https://...";
    inp.setAttribute("aria-label", "Link");
    inp.oninput = () => { s.url = inp.value; };
    const del = el("button", "btn small red", "\u2715");
    del.type = "button";
    del.setAttribute("aria-label", "Remove");
    del.onclick = () => { editSocials.splice(i, 1); renderSocRows(); };
    row.append(sel, inp, del);
    box.appendChild(row);
  });
}
$("btnSocials").onclick = () => {
  editSocials = data.site.socials.map(s => ({ type: s.type, url: s.url }));
  if (!editSocials.length) editSocials.push({ type: "discord", url: "" });
  renderSocRows();
  $("socialDialog").showModal();
};
$("socAdd").onclick = () => {
  editSocials.push({ type: "youtube", url: "" });
  renderSocRows();
  const rows = $("socRows");
  rows.scrollTop = rows.scrollHeight;
};
$("lCancel").onclick = () => $("socialDialog").close();
$("socialForm").onsubmit = () => {
  data.site.socials = editSocials
    .map(s => ({ type: s.type, url: toLink(s.url) }))
    .filter(s => s.url);
  changed();
};

/* ---------- top-left button editor ---------- */
function openContact() {
  $("cText").value = data.site.contact.text;
  $("cLink").value = data.site.contact.link;
  $("contactDialog").showModal();
}
$("btnContact").onclick = openContact;
$("contactBtn").addEventListener("click", e => {
  if (IS_ADMIN && !$("contactBtn").getAttribute("href")) { e.preventDefault(); openContact(); }
});
$("contactBtn").addEventListener("keydown", e => {
  if (e.key === "Enter" && !$("contactBtn").getAttribute("href")) { if (IS_ADMIN) openContact(); }
});
$("cCancel").onclick = () => $("contactDialog").close();
$("contactForm").onsubmit = () => {
  data.site.contact = {
    text: $("cText").value.trim() || "Build your own website!",
    link: toLink($("cLink").value)
  };
  changed();
};

/* ---------- logo keyboard support: Enter does nothing, but hover/focus pops it ---------- */

/* ---------- export / import / reset ---------- */
function toast(msg) {
  const t = el("div", "toast", msg);
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 5000);
}

$("btnExport").onclick = () => {
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "downloads.json";
  a.click();
  URL.revokeObjectURL(a.href);
  toast("Now upload downloads.json to your GitHub repo to publish it.");
};

$("btnImport").onclick = () => $("importFile").click();
$("importFile").onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    const d = JSON.parse(await f.text());
    if (!d.site || !Array.isArray(d.items)) throw new Error();
    data = normalize(d); changed(); toast("Loaded.");
  } catch (err) { toast("That is not a valid downloads.json file."); }
  e.target.value = "";
};

$("btnReset").onclick = async () => {
  if (!confirm("Throw away your unsaved changes and reload the published version?")) return;
  try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
  await load(); render();
};

/* ---------- start ---------- */
initTheme();
(async function init() {
  await load();
  if (IS_ADMIN) $("adminbar").hidden = false;
  render();
  const probe = new Image();
  probe.onload = () => document.body.classList.add("has-bg");
  probe.src = "assets/images/background.png";
})();
</script>
</body>
